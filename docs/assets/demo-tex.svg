<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">LaTeX compiles to a PDF beside its source</title>
  <desc id="desc">A LaTeX file in Split view. The caret sits on a number in the source, and the number changes from 3 to 4 to 5. After each change YOmux compiles the current text without saving, and the PDF on the right shows the new number.</desc>
  <style>
    svg { --cycle: 12s; font-family: ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, monospace; }
    .serif { font-family: "Latin Modern Roman", "Computer Modern", Georgia, serif; }
    .src-5, .pdf-5 { visibility: visible; }
    .src-3, .src-4, .pdf-3, .pdf-4, .compiling, .edited { visibility: hidden; }
    @media (prefers-reduced-motion: no-preference) {
      .src-3 { animation: src-3 var(--cycle) step-end infinite; }
      .src-4 { animation: src-4 var(--cycle) step-end infinite; }
      .src-5 { animation: src-5 var(--cycle) step-end infinite; }
      .pdf-3 { animation: pdf-3 var(--cycle) step-end infinite; }
      .pdf-4 { animation: pdf-4 var(--cycle) step-end infinite; }
      .pdf-5 { animation: pdf-5 var(--cycle) step-end infinite; }
      .compiling { animation: compiling var(--cycle) step-end infinite; }
      .edited { animation: edited var(--cycle) step-end infinite; }
      .caret { animation: blink 1s step-end infinite; }
    }
    /* Each 4s round: the caret sits at the number, the number changes at 1s, compiling runs 1.5-2.5s, then the PDF updates. */
    @keyframes src-3 { 0% { visibility: hidden; } 8.333% { visibility: visible; } 41.667%, 100% { visibility: hidden; } }
    @keyframes src-4 { 0% { visibility: hidden; } 41.667% { visibility: visible; } 75%, 100% { visibility: hidden; } }
    @keyframes src-5 { 0% { visibility: visible; } 8.333% { visibility: hidden; } 75%, 100% { visibility: visible; } }
    @keyframes pdf-3 { 0% { visibility: hidden; } 20.833% { visibility: visible; } 54.167%, 100% { visibility: hidden; } }
    @keyframes pdf-4 { 0% { visibility: hidden; } 54.167% { visibility: visible; } 87.5%, 100% { visibility: hidden; } }
    @keyframes pdf-5 { 0% { visibility: visible; } 20.833% { visibility: hidden; } 87.5%, 100% { visibility: visible; } }
    @keyframes compiling {
      0% { visibility: hidden; } 12.5% { visibility: visible; } 20.833% { visibility: hidden; }
      45.833% { visibility: visible; } 54.167% { visibility: hidden; }
      79.167% { visibility: visible; } 87.5%, 100% { visibility: hidden; }
    }
    @keyframes edited {
      0% { visibility: hidden; } 8.333% { visibility: visible; } 20.833% { visibility: hidden; }
      41.667% { visibility: visible; } 54.167% { visibility: hidden; }
      75% { visibility: visible; } 87.5%, 100% { visibility: hidden; }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="720" height="320" rx="12" fill="#11161d"/>
  <!-- Source -->
  <rect x="12" y="12" width="348" height="296" rx="8" fill="#1b222d"/>
  <rect x="352" y="12" width="8" height="296" fill="#1b222d"/>
  <text x="28" y="38" font-size="12" font-weight="700" fill="#aab7ca">paper.tex · source</text>
  <g class="edited">
    <rect x="22" y="124" width="326" height="20" rx="3" fill="#304530"/>
    <rect x="22" y="148" width="326" height="20" rx="3" fill="#304530"/>
  </g>
  <g class="mono" font-size="12">
    <text x="28" y="70" fill="#9db7f9">\documentclass{article}</text>
    <text x="28" y="90" fill="#9db7f9">\begin{document}</text>
    <text x="28" y="114" fill="#cad6e6">\section{Results}</text>
    <text x="28" y="138" fill="#cad6e6">Search is</text>
    <text x="100.2" y="138" fill="#edf1f7" class="src-3">3</text>
    <text x="100.2" y="138" fill="#edf1f7" class="src-4">4</text>
    <text x="100.2" y="138" fill="#edf1f7" class="src-5">5</text>
    <text x="114.6" y="138" fill="#cad6e6">times faster:</text>
    <rect class="caret" x="107.6" y="126" width="2" height="15" fill="#a8e312"/>
    <text x="28" y="162" fill="#cad6e6">\[ t = \frac{n}{</text>
    <text x="143.4" y="162" fill="#edf1f7" class="src-3">3</text>
    <text x="143.4" y="162" fill="#edf1f7" class="src-4">4</text>
    <text x="143.4" y="162" fill="#edf1f7" class="src-5">5</text>
    <text x="150.6" y="162" fill="#cad6e6">} \]</text>
    <text x="28" y="186" fill="#9db7f9">\end{document}</text>
  </g>
  <text x="28" y="290" font-size="11" fill="#8998ad">Compiles the current text, saved or not.</text>
  <!-- PDF -->
  <rect x="360" y="12" width="348" height="296" rx="8" fill="#2b3442"/>
  <rect x="360" y="12" width="8" height="296" fill="#2b3442"/>
  <line x1="360" y1="12" x2="360" y2="308" stroke="#3a4759"/>
  <text x="380" y="38" font-size="12" font-weight="700" fill="#aab7ca">paper.pdf</text>
  <text x="692" y="38" font-size="11" fill="#aab7ca" text-anchor="end">− 100% +</text>
  <rect x="404" y="52" width="264" height="246" fill="#ffffff"/>
  <g class="serif" fill="#1b222d">
    <text x="424" y="92" font-size="16" font-weight="700">1   Results</text>
    <text x="424" y="122" font-size="12">Search is</text>
    <text x="471.5" y="122" font-size="12" class="pdf-3">3</text>
    <text x="471.5" y="122" font-size="12" class="pdf-4">4</text>
    <text x="471.5" y="122" font-size="12" class="pdf-5">5</text>
    <text x="481" y="122" font-size="12">times faster:</text>
    <text x="520" y="160" font-size="16" font-style="italic">t</text>
    <text x="532" y="160" font-size="16">=</text>
    <text x="552" y="152" font-size="14" font-style="italic">n</text>
    <line x1="550" y1="157" x2="564" y2="157" stroke="#1b222d" stroke-width="1"/>
    <text x="553" y="172" font-size="14" class="pdf-3">3</text>
    <text x="553" y="172" font-size="14" class="pdf-4">4</text>
    <text x="553" y="172" font-size="14" class="pdf-5">5</text>
    <text x="536" y="286" font-size="10" text-anchor="middle">1</text>
  </g>
  <g class="compiling">
    <rect x="474" y="200" width="124" height="22" rx="11" fill="#382b12"/>
    <text x="536" y="215" font-size="11" fill="#f2ce7e" text-anchor="middle">Compiling…</text>
  </g>
</svg>
