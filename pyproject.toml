# Python developer tooling only. Product commands are installed by tools/install.sh.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yomux"
description = "Browser tools for watching, driving, and summarizing tmux sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Keiven Chang" }]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# Test / dev tooling.
dev = [
  "pyyaml",
  "watchfiles>=1.2.0",
  "mypy",
  "pillow",
  "pytest",
  "pytest-timeout",
  "pytest-xdist",
  "selenium",
]

[tool.setuptools.packages.find]
include = ["tools*", "yomux_lib*"]

[tool.setuptools.package-data]
tools = ["product_namespace.json"]

# Package metadata reads the product version from version.yaml through the compatibility module.
[tool.setuptools.dynamic]
version = { attr = "yomux_lib.version.YOMUX_VERSION" }
